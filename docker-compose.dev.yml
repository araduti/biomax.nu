services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: biomax
      POSTGRES_PASSWORD: biomax
      POSTGRES_DB: biomax_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biomax -d biomax_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
